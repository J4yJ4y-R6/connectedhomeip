[platformio]
default_envs = esp32pqc

[env:esp32pqc]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600
; NOTE: PlatformIO bundles its own ESP-IDF. If the bundled version is
; incompatible with the Matter codebase, point to the system IDF instead:
; custom_idf_path = ${sysenv.IDF_PATH}
;
; NOTE: The Matter build requires 'gn' to be installed and in PATH.
; PlatformIO does not install it automatically.
; Install with: pip install gn  OR  apt install ninja-build + download gn binary
